services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: coursepilot
      POSTGRES_PASSWORD: local-owner-password
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coursepilot"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:

