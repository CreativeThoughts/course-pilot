<div id="cp-palettes">
<style>
#cp-palettes{font-family:Arial,sans-serif;color:light-dark(#202737,#eef1f6);color-scheme:light dark}#cp-palettes *{box-sizing:border-box}#cp-palettes .choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:18px}#cp-palettes button{font:inherit;text-align:left;padding:14px;border:1px solid light-dark(#d8dce2,#454b57);border-radius:10px;background:light-dark(#fff,#222833);color:inherit;min-width:0}#cp-palettes button[aria-pressed=true]{outline:2px solid light-dark(#303c56,#c6d1e9)}#cp-palettes .name{display:block;font-weight:600;margin-bottom:10px}#cp-palettes .swatches{display:flex;height:28px;border-radius:5px;overflow:hidden}#cp-palettes .swatches span{flex:1}#cp-palettes .detail{display:block;margin-top:8px;font-size:12px}#cp-palettes .preview{--brand:#3448A5;--ink:#17233D;--wash:#F5F6FA;--soft:#E9EDFB;color-scheme:light;background:var(--wash);color:var(--ink);border:1px solid #dce0e8;border-radius:14px;overflow:hidden}#cp-palettes .chrome{background:#fff;padding:18px 22px;border-bottom:1px solid #e5e7eb;display:flex;gap:10px;align-items:center}#cp-palettes .logo{background:var(--brand);width:18px;height:18px;border-radius:6px}#cp-palettes .inst{margin-left:auto;color:#667085;font-size:12px}#cp-palettes .content{padding:26px}#cp-palettes .eyebrow{font-size:12px;color:#667085}#cp-palettes h3{font-size:24px;line-height:1.3;font-weight:600;margin:7px 0 20px}#cp-palettes .steps{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:20px;font-size:13px;color:#667085}#cp-palettes .active{background:var(--soft);color:var(--brand);border-radius:6px;padding:7px 10px}#cp-palettes .step{padding:7px 0}#cp-palettes .task{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:20px}#cp-palettes .row{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}#cp-palettes .risk{font-size:12px;color:#8B4605;background:#FFF2D8;padding:5px 8px;border-radius:5px}#cp-palettes p{font-size:14px;color:#576174;margin:12px 0 18px}#cp-palettes .action{display:inline-block;background:var(--brand);color:white;font-size:14px;padding:11px 16px;border-radius:7px}#cp-palettes .tokens{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin-top:16px;color:#576174}@media(max-width:400px){#cp-palettes .choices{grid-template-columns:1fr}#cp-palettes .content{padding:18px}#cp-palettes .inst{display:none}}
</style>
<div class="choices" aria-label="Colour palettes">
<button class="cursor-interaction" type="button" data-palette="indigo" aria-pressed="true"><span class="name">Midnight & indigo · Recommended</span><span class="swatches"><span style="background:#17233D"></span><span style="background:#3448A5"></span><span style="background:#E9EDFB"></span><span style="background:#F5F6FA"></span></span><span class="detail">Precise, contemporary, professional</span></button>
<button class="cursor-interaction" type="button" data-palette="teal" aria-pressed="false"><span class="name">Deep teal & ivory</span><span class="swatches"><span style="background:#183B3A"></span><span style="background:#14675F"></span><span style="background:#E2EFEB"></span><span style="background:#F8F7F3"></span></span><span class="detail">Calm, welcoming, refined</span></button>
<button class="cursor-interaction" type="button" data-palette="blue" aria-pressed="false"><span class="name">Slate & cobalt</span><span class="swatches"><span style="background:#243247"></span><span style="background:#2459C4"></span><span style="background:#E9F0FF"></span><span style="background:#F5F7FA"></span></span><span class="detail">Crisp, familiar, confident</span></button>
<button class="cursor-interaction" type="button" data-palette="plum" aria-pressed="false"><span class="name">Aubergine & stone</span><span class="swatches"><span style="background:#34273D"></span><span style="background:#6E4275"></span><span style="background:#F0E8F1"></span><span style="background:#F8F6F3"></span></span><span class="detail">Distinctive, understated, elegant</span></button>
</div>
<div class="preview" aria-label="Course Pilot palette preview"><div class="chrome"><span class="logo"></span><strong>Course Pilot</strong><span class="inst">Lincoln Institute</span></div><div class="content"><div class="eyebrow">PLAN INTAKE</div><h3>Prepare Semester 1, 2027</h3><div class="steps"><span class="active">Students</span><span class="step">Subjects</span><span class="step">Teaching</span><span class="step">Timetable</span></div><div class="task"><div class="row"><strong>Review completion risks</strong><span class="risk">12 need review</span></div><p>Help students find a pathway before their CoE ends.</p><span class="action">Review students →</span></div><div class="tokens" aria-live="polite"><span id="cp-brand">Primary #3448A5</span><span id="cp-surface">Canvas #F5F6FA</span><span>Illustrative data</span></div></div></div>
<script>
(function(){const root=document.getElementById('cp-palettes');const preview=root.querySelector('.preview');const palettes={indigo:['#3448A5','#17233D','#F5F6FA','#E9EDFB'],teal:['#14675F','#183B3A','#F8F7F3','#E2EFEB'],blue:['#2459C4','#243247','#F5F7FA','#E9F0FF'],plum:['#6E4275','#34273D','#F8F6F3','#F0E8F1']};root.querySelectorAll('[data-palette]').forEach(button=>button.addEventListener('click',()=>{const colours=palettes[button.dataset.palette];['--brand','--ink','--wash','--soft'].forEach((key,i)=>preview.style.setProperty(key,colours[i]));root.querySelectorAll('[data-palette]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));root.querySelector('#cp-brand').textContent='Primary '+colours[0];root.querySelector('#cp-surface').textContent='Canvas '+colours[2];}));})();
</script>
</div>
